name: bundle-vsix

# 构建“安装即用”的平台 VSIX：每个包装对应平台的两个二进制，用户不需要另外安装。
#
#   bin/bdl-lsp   语言服务器
#   bin/tiptop    链接资料采集 + 部署（从 bdl-lsp 分离）
#
# 为什么按平台分开打包：
#   bdl-lsp 是 CGO + tree-sitter 的原生二进制，不能一个包跨三个系统。
#   VSCode 的 `--target` 会写进 VSIX 清单，市场/安装器据此只分发匹配的包。
#
# 触发：
#   - 手动 Run workflow（可指定 bdl-lsp 的 ref）
#   - push tag（v*）
#
# 产物：Actions 页面每个 job 的 vsix-<target> artifact。

on:
  workflow_dispatch:
    inputs:
      bdl_lsp_ref:
        description: "bdl-lsp 的 git ref（分支/tag/SHA）"
        required: true
        default: main
        type: string
      tiptop_ref:
        description: "tiptop 的 git ref（分支/tag/SHA）"
        required: true
        default: main
        type: string
      publish:
        description: "构建完是否发布（GitHub Release + VS Code 市场）；tag 推送时总是发布"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  # 先确认两个依赖仓库读得到，再开四个平台的打包。
  # 否则私有仓库会表现为"四个 job 全红"，每个都只有一句
  # "Repository not found"，很难看出是权限问题而不是构建问题。
  preflight:
    name: 前置检查
    runs-on: ubuntu-latest
    steps:
      - name: 检查依赖仓库可访问
        env:
          TOKEN: ${{ secrets.TIPTOP_TOKEN || github.token }}
        run: |
          set -euo pipefail
          # 用 API 而不是 `git ls-remote`：私有仓库 + 无效 token 时 git 会
          # 挂起等输入密码（实测本地 3 分钟才超时，CI 里会卡到 job 超时）。
          # curl 有硬超时，秒级给出结论。
          check() {
            repo="$1"; label="$2"
            hdr=()
            if [ -n "${TOKEN}" ]; then
              hdr=(-H "Authorization: Bearer ${TOKEN}")
            fi
            # 空数组在 set -u 下要用 ${arr[@]+...} 展开，兼容 bash 4.3
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 --retry 0 \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              ${hdr[@]+"${hdr[@]}"} \
              "https://api.github.com/repos/${repo}" 2>/dev/null) || code="000"
            case "$code" in
              200) echo "✅ ${label} (${repo}) 可访问";;
              401|403)
                echo "::error::${label} (${repo}) token 无效或无权限（HTTP ${code}）。"
                echo "  检查 secret TIPTOP_TOKEN 是否过期／缺少该仓库的读取权限。"
                exit 1
                ;;
              404)
                echo "::error::${label} (${repo}) 返回 404：私有仓库而 token 看不到，或仓库不存在。"
                echo "  解决其一："
                echo "  1) 把 ${repo} 改为公开（Settings → General → Danger Zone → Change visibility）；"
                echo "  2) 新建 PAT 保存为 secret TIPTOP_TOKEN（classic 勾 repo，"
                echo "     或 fine-grained 给该仓库 Contents: Read）。"
                exit 1
                ;;
              *)
                echo "::error::${label} (${repo}) 检查失败（HTTP ${code}）；网络或 API 限流。"
                exit 1
                ;;
            esac
          }
          check darcyjoven/bdl-lsp "bdl-lsp"
          check darcyjoven/tiptop "tiptop"

  bundle:
    name: ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
            goos: windows
            goarch: amd64
            binary: bdl-lsp.exe
            tiptop_binary: tiptop.exe
            uname_arch: x86_64
          - os: ubuntu-22.04
            target: linux-x64
            goos: linux
            goarch: amd64
            binary: bdl-lsp
            tiptop_binary: tiptop
            uname_arch: x86_64
          # macOS 13 已下线；Intel 用 macos-15-intel，Apple Silicon 用 macos-15。
          - os: macos-15-intel
            target: darwin-x64
            goos: darwin
            goarch: amd64
            binary: bdl-lsp
            tiptop_binary: tiptop
            uname_arch: x86_64
          - os: macos-15
            target: darwin-arm64
            goos: darwin
            goarch: arm64
            binary: bdl-lsp
            tiptop_binary: tiptop
            uname_arch: arm64
    steps:
      - name: 检出扩展
        uses: actions/checkout@v4
        with:
          path: vscode-extension

      - name: 检出 bdl-lsp
        uses: actions/checkout@v4
        with:
          repository: darcyjoven/bdl-lsp
          path: bdl-lsp
          ref: ${{ inputs.bdl_lsp_ref || 'main' }}

      # tiptop 的 go.mod 里有 `replace ... => ../bdl-lsp`，
      # 所以两个仓库必须是**同级目录**：bdl-lsp/ 与 tiptop/。
      #
      # token 说明：默认的 `github.token` 只对**本仓库**有效，读不了同账号下的
      # 私有仓库（GitHub 会返回 404 "Repository not found"，不暴露它是否存在）。
      # 所以：
      #   - tiptop 是公开仓库 → 不需要额外配置，会自动回退到 github.token；
      #   - tiptop 是私有仓库 → 必须配置 secret `TIPTOP_TOKEN`
      #     （classic PAT 勾 repo，或 fine-grained PAT 给 tiptop 的 Contents: Read）。
      - name: 检出 tiptop
        uses: actions/checkout@v4
        with:
          repository: darcyjoven/tiptop
          path: tiptop
          ref: ${{ inputs.tiptop_ref || 'main' }}
          token: ${{ secrets.TIPTOP_TOKEN || github.token }}

      - name: 确认 runner 架构
        shell: bash
        run: |
          set -euo pipefail
          got="$(uname -m)"
          echo "runner=$RUNNER_OS/${got}，目标=${{ matrix.target }}"
          if [ "$got" != "${{ matrix.uname_arch }}" ]; then
            echo "runner 架构与矩阵不符：期望 ${{ matrix.uname_arch }}，实际 $got"
            exit 1
          fi

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bdl-lsp/go.mod
          cache-dependency-path: bdl-lsp/go.sum

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      # Windows 的 CGO 需要 MinGW gcc；VS Code 的其它步骤仍用 Git Bash。
      - name: 安装 MinGW（Windows）
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: 构建 bdl-lsp
        id: lsp
        shell: bash
        run: |
          set -euo pipefail
          cd bdl-lsp
          VERSION="$(sed -n 's/^var version = "\(.*\)"/\1/p' main.go)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "bdl-lsp $VERSION -> ${{ matrix.target }}"

          if [ "${{ runner.os }}" = "Windows" ]; then
            export PATH="/c/msys64/mingw64/bin:$PATH"
            export CC=gcc
          fi

          mkdir -p ../bdl-lsp-bin
          export CGO_ENABLED=1
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}

          # Windows 先尝试静态链接，避免用户机器缺 libwinpthread-1.dll。
          # 静态失败时退回动态链接，并把 MinGW 运行库一起打包。
          if [ "${{ runner.os }}" = "Windows" ]; then
            if go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION -linkmode external -extldflags '-static'" \
              -o "../bdl-lsp-bin/${{ matrix.binary }}" .; then
              echo "Windows 静态链接成功"
            else
              echo "Windows 静态链接失败，退回动态链接并打包运行库"
              go build -trimpath \
                -ldflags "-s -w -X main.version=$VERSION" \
                -o "../bdl-lsp-bin/${{ matrix.binary }}" .
              cp /c/msys64/mingw64/bin/libwinpthread-1.dll ../bdl-lsp-bin/ 2>/dev/null || true
              cp /c/msys64/mingw64/bin/libgcc_s_seh-1.dll ../bdl-lsp-bin/ 2>/dev/null || true
            fi
          else
            go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "../bdl-lsp-bin/${{ matrix.binary }}" .
          fi

          "../bdl-lsp-bin/${{ matrix.binary }}" version

      # tiptop 依赖 bdl-lsp 的公开包（link / parser / index / builtin），
      # 同样是 CGO，构建参数与上面保持一致。
      - name: 构建 tiptop
        id: tiptop
        shell: bash
        run: |
          set -euo pipefail
          cd tiptop
          VERSION="$(sed -n 's/^var version = "\(.*\)"/\1/p' main.go)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tiptop $VERSION -> ${{ matrix.target }}"

          if [ "${{ runner.os }}" = "Windows" ]; then
            export PATH="/c/msys64/mingw64/bin:$PATH"
            export CC=gcc
          fi

          mkdir -p ../tiptop-bin
          export CGO_ENABLED=1
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}

          TIPTOP_BIN="tiptop.exe"
          if [ "${{ runner.os }}" != "Windows" ]; then
            TIPTOP_BIN="tiptop"
          fi

          if [ "${{ runner.os }}" = "Windows" ]; then
            if go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION -linkmode external -extldflags '-static'" \
              -o "../tiptop-bin/$TIPTOP_BIN" .; then
              echo "Windows 静态链接成功"
            else
              echo "Windows 静态链接失败，退回动态链接并打包运行库"
              go build -trimpath \
                -ldflags "-s -w -X main.version=$VERSION" \
                -o "../tiptop-bin/$TIPTOP_BIN" .
              cp /c/msys64/mingw64/bin/libwinpthread-1.dll ../tiptop-bin/ 2>/dev/null || true
              cp /c/msys64/mingw64/bin/libgcc_s_seh-1.dll ../tiptop-bin/ 2>/dev/null || true
            fi
          else
            go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "../tiptop-bin/$TIPTOP_BIN" .
          fi

          "../tiptop-bin/$TIPTOP_BIN" version

      - name: 安装扩展依赖
        working-directory: vscode-extension
        run: npm ci --include=dev
        env:
          NODE_ENV: ""

      - name: 打包平台 VSIX
        working-directory: vscode-extension
        env:
          BDL_VSCODE_TARGET: ${{ matrix.target }}
          BDL_LSP_BINARY: ${{ github.workspace }}/bdl-lsp-bin/${{ matrix.binary }}
          BDL_LSP_VERSION: ${{ steps.lsp.outputs.version }}
          TIPTOP_BINARY: ${{ github.workspace }}/tiptop-bin/${{ matrix.tiptop_binary }}
          TIPTOP_VERSION: ${{ steps.tiptop.outputs.version }}
        run: npm run package

      - name: 校验 VSIX 内容
        working-directory: vscode-extension
        shell: bash
        run: |
          set -euo pipefail
          VSIX="$(ls dist-vsix/*.vsix)"
          ls -lh "$VSIX"
          unzip -l "$VSIX"
          # 共享校验：平台包必须含当前平台二进制 + 初始化脚本；仓库内部文件（除 scripts/init-project/）一律禁止
          bash scripts/check-vsix.sh "$VSIX" --platform

      - name: 上传平台 VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: vscode-extension/dist-vsix/*.vsix
          if-no-files-found: error

  # ------------------------------------------------------------------ 发布
  # tag（v*）推送后：4 个平台的 vsix 挂到 GitHub Release，再由 4 个独立 job
  # 分别发布到 VS Code 市场。手动触发时默认**不**发布，要勾 publish。
  #
  # 为什么按平台拆成独立 job：
  #   市场按（版本号, targetPlatform）存版本。第一次发某个版本号时，扩展创建后
  #   还要异步校验，紧接着上传其它平台会被当成「版本已存在」拒绝（409）。之前
  #   在一个 job 里循环 4 个包，只有第一个成功、其余被 --skip-duplicate 吞掉，
  #   job 仍是绿的，结果 Windows 用户装不上（v0.9.0 就是这么丢的）。
  #   现在每平台一个 job、串行执行：避开首包竞态，单个失败不影响其它平台，
  #   且失败会显性报出来。
  #
  # 需要的仓库 secret：
  #   VSCE_PAT      Azure DevOps PAT，Scope = Marketplace → Manage（发布市场必需）
  #   TIPTOP_TOKEN  只有当 tiptop 是私有仓库时才需要（preflight/bundle 已用）
  release:
    name: 发布（GitHub Release）
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # 建 Release 需要
    steps:
      - name: 检出扩展（只读版本号）
        uses: actions/checkout@v4

      - name: 安装 Node（vsce 需要 20+）
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 收齐四个平台包
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: vsix-*
          merge-multiple: true

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="$(node -p "require('./package.json').version")"
          # tag 推送就用 tag 名；手动触发按 package.json 版本补一个 v 前缀
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            if [ "$TAG" != "v${V}" ]; then
              echo "::error::tag ${TAG} 与 package.json 版本 v${V} 不一致：先改版本再打 tag"
              exit 1
            fi
          else
            TAG="v${V}"
          fi
          ls -lh dist
          echo "→ Release $TAG"
          if ! gh release create "$TAG" dist/*.vsix --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes; then
            echo "Release 已存在，改为覆盖上传"
            gh release upload "$TAG" dist/*.vsix --repo "$GITHUB_REPOSITORY" --clobber
          fi

  # 每个平台一个 job；max-parallel: 1 让它们串行，避免同版本首包竞态。
  # win32-x64 放在最前：Windows 用户是这次的主要缺口。
  publish:
    name: 发布 ${{ matrix.target }}
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [win32-x64, linux-x64, darwin-x64, darwin-arm64]
    steps:
      - name: 检出扩展（只读版本号）
        uses: actions/checkout@v4

      - name: 安装 Node（vsce 需要 20+）
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 取本平台 VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: dist

      - name: 发布到 VS Code 市场
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          TARGET: ${{ matrix.target }}
        run: |
          set -uo pipefail
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::error::缺少 secret VSCE_PAT（Azure DevOps PAT，Scope 选 Marketplace → Manage）"
            exit 1
          fi

          V="$(node -p "require('./package.json').version")"
          VSIX="$(find dist -maxdepth 1 -name '*.vsix' -print -quit)"
          if [ -z "$VSIX" ]; then
            echo "::error::没找到 $TARGET 的 VSIX"
            exit 1
          fi
          echo "版本 $V，包 $VSIX，平台 $TARGET"

          # 市场查询：该 (版本, 平台) 是否已经在架
          published() {
            curl -sS --max-time 20 -X POST \
              "https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery" \
              -H "Accept: application/json;api-version=7.2-preview.1" \
              -H "Content-Type: application/json" \
              -d '{"filters":[{"criteria":[{"filterType":7,"value":"darcyjoven.4gl-full"}],"pageNumber":1,"pageSize":1}],"flags":1}' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); vs=d["results"][0]["extensions"][0].get("versions") or []; sys.exit(0 if any(x.get("version")==sys.argv[1] and (x.get("targetPlatform") or "universal")==sys.argv[2] for x in vs) else 1)' "$V" "$TARGET"
          }

          if published; then
            echo "已在市场：$V / $TARGET，跳过"
            exit 0
          fi

          # 平台信息在 VSIX 清单里（打包时 `vsce package --target` 写入），
          # publish 只给 --packagePath：再传 --target 会被 vsce 直接拒绝。
          # 也不用 --skip-duplicate——那会把 409 吞成成功，正是 v0.9.0 缺包的原因。
          for attempt in $(seq 1 20); do
            echo "→ 第 ${attempt} 次发布 $V / $TARGET"
            if npx --yes @vscode/vsce@4 publish --packagePath "$VSIX"; then
              break
            fi
            if published; then
              echo "市场已出现 $V / $TARGET"
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "::error::$V / $TARGET 连续 20 次发布失败"
              exit 1
            fi
            echo "本次失败，30 秒后重试"
            sleep 30
          done

          if ! published; then
            echo "::error::发布结束但市场里查不到 $V / $TARGET"
            exit 1
          fi
          echo "✅ $V / $TARGET 已上架"

  # 兜底断言：四个平台缺一个就红，避免再出现「job 绿但 Windows 装不上」。
  verify:
    name: 校验四平台
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - name: 检出扩展（只读版本号）
        uses: actions/checkout@v4

      - name: 断言 4 个平台都在市场
        run: |
          set -euo pipefail
          V="$(node -p "require('./package.json').version")"
          curl -sS --max-time 20 -X POST \
            "https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery" \
            -H "Accept: application/json;api-version=7.2-preview.1" \
            -H "Content-Type: application/json" \
            -d '{"filters":[{"criteria":[{"filterType":7,"value":"darcyjoven.4gl-full"}],"pageNumber":1,"pageSize":1}],"flags":1}' \
          > /tmp/market.json
          # 打印已有平台（stderr），并把缺失平台列表输出到 stdout
          MISSING="$(python3 -c 'import json,sys; v=sys.argv[1]; want={"win32-x64","linux-x64","darwin-x64","darwin-arm64"}; ext=json.load(open("/tmp/market.json"))["results"][0]["extensions"][0]; have={x.get("targetPlatform") or "universal" for x in ext.get("versions") or [] if x.get("version")==v}; print(f"{v} 已有平台：{sorted(have)}", file=sys.stderr); print(" ".join(sorted(want-have)))' "$V")"
          if [ -n "$MISSING" ]; then
            echo "::error::$V 缺少平台：$MISSING"
            exit 1
          fi
          echo "四平台齐全"
